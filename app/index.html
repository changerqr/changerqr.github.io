<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Changer.ae App</title>
<script>
  // Sends each phone straight to its own app store. Computers stay on this page and choose a store below.
  // The buttons in the page repeat these links: change both together.
  (function () {
    var ua = navigator.userAgent || "";
    var stores = {
      apple: "https://apps.apple.com/ae/app/changer-ae/id6462992752",
      google: "https://play.google.com/store/apps/details?id=com.changer.changer",
      huawei: "https://appgallery.huawei.com/app/C109361597"
    };
    // iPadOS identifies as a Mac, so a Mac with a touch screen is treated as an iPad.
    var apple = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 0);
    // Huawei phones without Google services name their own browser or services in the user agent.
    var huawei = /HuaweiBrowser|HMSCore|HarmonyOS|OpenHarmony/i.test(ua);
    var android = /Android/i.test(ua);
    var target = apple ? stores.apple : huawei ? stores.huawei : android ? stores.google : "";
    if (target) window.location.replace(target);
  })();
</script>
<style>
  :root { --navy: #11053b; --muted: #5b5f7a; --page: #f6f7fb; --card: #ffffff; --line: #e9ebf2; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--page);
         color: var(--navy); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
         padding: 36px 28px; text-align: center; }
  img { width: 200px; max-width: 70%; height: auto; }
  h1 { font-size: 20px; margin: 24px 0 6px; }
  p { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
  a { display: block; margin: 10px 0; padding: 14px 16px; border-radius: 12px; background: var(--navy); color: #ffffff;
      text-decoration: none; font-weight: 600; font-size: 16px; }
  a:focus-visible { outline: 3px solid #2f6bff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="changer-logo.png" alt="Changer.ae">
  <h1>Get the Changer.ae app</h1>
  <p>Choose your store</p>
  <a href="https://apps.apple.com/ae/app/changer-ae/id6462992752">App Store (iPhone)</a>
  <a href="https://play.google.com/store/apps/details?id=com.changer.changer">Google Play (Android)</a>
  <a href="https://appgallery.huawei.com/app/C109361597">AppGallery (Huawei)</a>
</main>
</body>
</html>
